<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growlytic – Digital Marketing Agency</title>
<meta name="description" content="Digital marketing that brings you customers: SEO, social media, paid ads and email marketing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ff; --card:#fff; --ink:#1b1442; --muted:#5d5880; --violet:#5b3df5; --pink:#ff5d8f; --line:#e1dcf5; --soft:#ebe7ff;
  --head:"Sora",system-ui,sans-serif; --body:"Manrope",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--ink);font:400 1.05rem/1.65 var(--body)}
a{color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--head);line-height:1.1;letter-spacing:-.02em}
.wrap{max-width:1060px;margin:0 auto;padding:0 1.25rem}
section{padding:clamp(3rem,7vw,5rem) 0}
h2{font-size:clamp(1.9rem,4.5vw,2.8rem);margin-bottom:.6rem}
.lead{color:var(--muted);max-width:40rem;margin-bottom:2rem}

header{position:sticky;top:0;z-index:10;background:rgba(246,244,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:62px}
.logo{font:800 1.3rem var(--head);text-decoration:none}
.logo i{font-style:normal;color:var(--pink)}
nav{display:flex;align-items:center;gap:1.4rem}
nav a{text-decoration:none;font-weight:500;color:var(--muted)}
nav a:hover{color:var(--ink)}
nav a.btn{color:#fff}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;font-size:1.2rem;cursor:pointer;color:var(--ink)}
@media(max-width:720px){
  .burger{display:block}
